plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.105'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Repository principal pour NeoForge
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    // Repository principal pour TerraBlender
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/releases'
    }

    // Repository alternatif mentionné dans les issues GitHub
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }

    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            gameDirectory = project.file("run/client")

            systemProperty("neoforge.enabledGameTestNamespaces", project.mod_id)
        }

        server {
            server()
            gameDirectory = project.file("run/server")

            programArguments.add("--nogui")
            systemProperty("neoforge.enabledGameTestNamespaces", project.mod_id)
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file("run/gametest")

            systemProperty("neoforge.enabledGameTestNamespaces", project.mod_id)
        }

        data {
            data()
            gameDirectory = project.file("run/data")

            programArguments.addAll("--mod", project.mod_id, "--all", "--output",
                    file("src/generated/resources/").getAbsolutePath(),
                    "--existing", file("src/main/resources/").getAbsolutePath())
        }

        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }


    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.github.glitchfiend:TerraBlender-neoforge:1.21-4.0.0.0"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_versi&n}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            terrablender_version_range : terrablender_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Met tout le wiki a jour depuis le mod : runData, puis le script du wiki
// tools/sync-wiki.py, qui
//   - nettoie le wiki_data.json genere (secrets de tools/hidden.json) et le pose
//     dans data/ du wiki (jamais de copie brute : elle remettrait les secrets) ;
//   - recopie dans le dossier des assets (publie sur GitHub) tout ce qui vient
//     du mod (textures, sons, musiques, modeles 3D) et du dossier de travail
//     (wallpapers, logo, theme), en gardant le plus recent ;
//   - refait vignettes, apercus de partage, passants, inventaire du site ;
//   - affiche ce qui manque encore par rapport au tigre ;
//   - publie le dossier des assets sur GitHub (commit + push), d'ou le site le lit.
// Les dossiers vivent dans gradle.properties (ow_wiki_dir, ow_wiki_assets_dir, ow_studio_dir).
var wikiDataSource = file("src/generated/resources/wiki_data.json")
var wikiDir = file(providers.gradleProperty("ow_wiki_dir").get())
var wikiAssetsDir = file(providers.gradleProperty("ow_wiki_assets_dir").get())
var studioDir = file(providers.gradleProperty("ow_studio_dir").get())
var pythonExe = providers.gradleProperty("ow_python").getOrElse("python")
var modDir = projectDir

tasks.register("runWikiDatas") {
    group = "operation wild"
    description = "Lance runData, puis met a jour le JSON et tous les assets du wiki (${wikiDir}, ${wikiAssetsDir})."
    dependsOn tasks.named("runData")

    doLast {
        if (!wikiDataSource.isFile()) {
            throw new GradleException("wiki_data.json introuvable : ${wikiDataSource}")
        }
        var script = new File(wikiDir, "tools/sync-wiki.py")
        if (!script.isFile()) {
            throw new GradleException("Script du wiki introuvable : ${script}")
        }
        var args = [script.absolutePath,
                    "--mod", modDir.absolutePath,
                    "--export", wikiDataSource.absolutePath,
                    "--assets", wikiAssetsDir.absolutePath,
                    "--studio", studioDir.absolutePath]
        // « python » d'abord, « py » (le lanceur Windows) s'il n'est pas dans le PATH.
        Process process = null
        for (candidate in [pythonExe, "py"].unique()) {
            try {
                var builder = new ProcessBuilder([candidate] + args).directory(wikiDir).redirectErrorStream(true)
                builder.environment().put("PYTHONIOENCODING", "utf-8")
                process = builder.start()
                break
            } catch (IOException ignored) {
            }
        }
        if (process == null) {
            throw new GradleException("Python introuvable : installer Python, ou regler ow_python dans gradle.properties.")
        }
        process.inputStream.newReader("UTF-8").eachLine { logger.lifecycle(it) }
        if (process.waitFor() != 0) {
            throw new GradleException("La mise a jour du wiki a echoue (voir ci-dessus). Rien de secret n'a ete publie.")
        }
    }
}

var animToBlockbenchScript = new File(studioDir, "utils/java_anim_to_blockbench.py")
var blockbenchSyncDir = new File(studioDir, "utils/blockbench")
var animalModelsDir = new File(studioDir, "3D Models/Animals")
var javaAnimationsDir = file("src/main/java/net/tiew/operationWild/entity/client/animation")
var blockbenchExportDir = layout.buildDirectory.dir("blockbench").get().asFile
var blockbenchExe = file(providers.gradleProperty("ow_blockbench_exe")
        .getOrElse(System.getenv("LOCALAPPDATA") + "/Programs/Blockbench/Blockbench.exe"))
var blockbenchUserData = new File(System.getenv("APPDATA") ?: "", "Blockbench")
var blockbenchDebugPort = providers.gradleProperty("ow_blockbench_debug_port").getOrElse("9277")

tasks.register("runBlockbenchAnimations") {
    group = "operation wild"
    description = "Exporte les animations Java de chaque animal et les recharge dans Blockbench (${animalModelsDir}), sans rien sauvegarder."

    doLast {
        if (!animToBlockbenchScript.isFile()) {
            throw new GradleException("Script de conversion introuvable : ${animToBlockbenchScript}")
        }
        var plugin = new File(blockbenchSyncDir, "ow_anim_sync_driver.js")
        if (!plugin.isFile()) {
            throw new GradleException("Script de pilotage Blockbench introuvable : ${plugin}")
        }
        if (!blockbenchExe.isFile()) {
            throw new GradleException("Blockbench introuvable : ${blockbenchExe} (regler ow_blockbench_exe dans gradle.properties).")
        }
        blockbenchExportDir.mkdirs()

        var models = []
        var sources = javaAnimationsDir.listFiles().findAll { it.name.endsWith("Animations.java") }.sort { it.name }
        for (source in sources) {
            var species = source.name - "Animations.java"
            var snake = species.replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').toLowerCase()
            var model = new File(animalModelsDir, snake + ".bbmodel")
            if (!model.isFile()) {
                continue
            }
            var output = new File(blockbenchExportDir, snake + ".animation.json")
            var args = [animToBlockbenchScript.absolutePath, source.absolutePath, "-o", output.absolutePath]
            Process process = null
            for (candidate in [pythonExe, "py"].unique()) {
                try {
                    var builder = new ProcessBuilder([candidate] + args).directory(blockbenchExportDir).redirectErrorStream(true)
                    builder.environment().put("PYTHONIOENCODING", "utf-8")
                    process = builder.start()
                    break
                } catch (IOException ignored) {
                }
            }
            if (process == null) {
                throw new GradleException("Python introuvable : installer Python, ou regler ow_python dans gradle.properties.")
            }
            var lines = process.inputStream.newReader("UTF-8").readLines()
            if (process.waitFor() != 0) {
                lines.each { logger.error(it) }
                throw new GradleException("La conversion de ${source.name} a echoue (voir ci-dessus).")
            }
            logger.lifecycle("  ${snake.padRight(14)} ${lines.find { it.contains("animation(s)") } ?: ''}")
            models << [model: model.absolutePath, animations: output.absolutePath]
        }
        if (models.isEmpty()) {
            throw new GradleException("Aucun modele d'animal trouve dans ${animalModelsDir}.")
        }

        var driver = new File(blockbenchSyncDir, "ow_anim_sync_driver.js")
        var request = new File(blockbenchSyncDir, "sync_request.json")
        var http = java.net.http.HttpClient.newBuilder().connectTimeout(java.time.Duration.ofSeconds(1)).build()
        var json = new groovy.json.JsonSlurper()

        var debugUp = {
            try {
                var response = http.send(java.net.http.HttpRequest.newBuilder(URI.create("http://127.0.0.1:${blockbenchDebugPort}/json/version"))
                        .timeout(java.time.Duration.ofSeconds(1)).build(), java.net.http.HttpResponse.BodyHandlers.ofString())
                return response.statusCode() == 200
            } catch (Exception ignored) {
                return false
            }
        }

        if (!debugUp()) {
            var running = ["tasklist", "/FI", "IMAGENAME eq Blockbench.exe", "/NH"].execute().text.contains("Blockbench.exe")
            if (running) {
                var storage = new File(blockbenchUserData, "Local Storage/leveldb")
                var pluginInstalled = storage.isDirectory() && storage.listFiles().any { f ->
                    f.isFile() && (new String(f.bytes, "ISO-8859-1").contains("ow_anim_sync") || new String(f.bytes, "UTF-16LE").contains("ow_anim_sync"))
                }
                if (pluginInstalled) {
                    request.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                            [created: System.currentTimeMillis(), models: models])), "UTF-8")
                    logger.lifecycle("Blockbench etait deja ouvert : demande transmise au plugin ow_anim_sync, ${models.size()} modeles, rien n'est sauvegarde.")
                    return
                }
                throw new GradleException("Blockbench est deja ouvert hors du mode de synchronisation : le fermer, puis relancer la tache (elle le rouvrira elle-meme).")
            }
            new ProcessBuilder("cmd", "/c", "start", "", blockbenchExe.absolutePath, "--remote-debugging-port=${blockbenchDebugPort}").start().waitFor()
            var deadline = System.currentTimeMillis() + 60000
            while (!debugUp()) {
                if (System.currentTimeMillis() > deadline) {
                    throw new GradleException("Blockbench ne repond pas sur le port ${blockbenchDebugPort}.")
                }
                Thread.sleep(500)
            }
        }
        if (request.isFile()) {
            request.delete()
        }

        var targets = json.parseText(http.send(java.net.http.HttpRequest.newBuilder(URI.create("http://127.0.0.1:${blockbenchDebugPort}/json")).build(),
                java.net.http.HttpResponse.BodyHandlers.ofString()).body())
        var page = targets.find { it.type == "page" && it.url.contains("index.html") } ?: targets.find { it.type == "page" }
        if (page == null) {
            throw new GradleException("Aucune fenetre Blockbench trouvee sur le port ${blockbenchDebugPort}.")
        }

        var pending = new java.util.concurrent.ConcurrentHashMap<Integer, java.util.concurrent.CompletableFuture<Map>>()
        var nextId = new java.util.concurrent.atomic.AtomicInteger()
        var socket = http.newWebSocketBuilder().buildAsync(URI.create(page.webSocketDebuggerUrl), new java.net.http.WebSocket.Listener() {
            StringBuilder buffer = new StringBuilder()

            @Override
            java.util.concurrent.CompletionStage<?> onText(java.net.http.WebSocket webSocket, CharSequence data, boolean last) {
                buffer.append(data)
                if (last) {
                    var message = new groovy.json.JsonSlurper().parseText(buffer.toString())
                    buffer.setLength(0)
                    if (message.id != null) {
                        pending.remove(message.id as Integer)?.complete(message as Map)
                    }
                }
                webSocket.request(1)
                return null
            }
        }).get(10, java.util.concurrent.TimeUnit.SECONDS)

        var evaluate = { String expression, int seconds ->
            int id = nextId.incrementAndGet()
            var future = new java.util.concurrent.CompletableFuture<Map>()
            pending.put(id, future)
            socket.sendText(groovy.json.JsonOutput.toJson([id: id, method: "Runtime.evaluate",
                    params: [expression: expression, awaitPromise: true, returnByValue: true]]), true).get()
            var message = future.get(seconds, java.util.concurrent.TimeUnit.SECONDS)
            var result = message.result ?: [:]
            if (result.exceptionDetails) {
                throw new GradleException("Erreur dans Blockbench : ${result.exceptionDetails.exception?.description ?: result.exceptionDetails.text}")
            }
            return result.result?.value
        }

        try {
            var readyDeadline = System.currentTimeMillis() + 60000
            while (true) {
                evaluate(driver.getText("UTF-8"), 10)
                if (evaluate("window.__owAnimSyncReady()", 10) == true) break
                if (System.currentTimeMillis() > readyDeadline) {
                    throw new GradleException("Blockbench n'a pas fini de demarrer.")
                }
                Thread.sleep(500)
            }
            evaluate("Promise.race([Plugins.loading_promise, new Promise(r => setTimeout(r, 4000))]).then(() => true)", 15)

            var lines = []
            int synced = 0
            for (entry in models) {
                var content = new File(entry.animations).getText("UTF-8")
                var name = new File(entry.model).name - ".bbmodel"
                try {
                    var outcome = evaluate("window.__owAnimSync(${groovy.json.JsonOutput.toJson(entry.model)}, ${groovy.json.JsonOutput.toJson(content)}, ${groovy.json.JsonOutput.toJson(entry.animations)})", 60)
                    lines << "${name} : ${outcome.added} animations (${outcome.removed} retirees)"
                    synced++
                } catch (Exception e) {
                    lines << "${name} : ECHEC (${e.message})"
                }
                logger.lifecycle("  -> ${lines.last()}")
            }
            evaluate("window.__owAnimSyncDone(${groovy.json.JsonOutput.toJson(lines)}, ${synced}, ${models.size()})", 10)
            logger.lifecycle("${synced} / ${models.size()} modeles mis a jour dans Blockbench, rien n'est sauvegarde.")
            if (synced < models.size()) {
                throw new GradleException("Certains modeles n'ont pas pu etre mis a jour (voir ci-dessus).")
            }
        } finally {
            socket.sendClose(java.net.http.WebSocket.NORMAL_CLOSURE, "").get(5, java.util.concurrent.TimeUnit.SECONDS)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
